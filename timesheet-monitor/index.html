<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Timesheet"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Timesheet Monitor</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:14px}.head{background:#0f172a;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:10px}button{background:white;cursor:pointer}.primary{background:#22d3ee;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:22px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:68px}.day.sel{outline:2px solid #06b6d4;background:#ecfeff}.day small{display:block;color:#047857}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.total{background:#0f172a;color:white;padding:14px;border-radius:12px;font-size:20px}.quick button{padding:5px 8px;font-size:12px;margin:5px 5px 0 0}.warn{background:#fffbeb;color:#92400e;padding:10px;border-radius:10px}.muted{color:#64748b;font-size:12px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.day{min-height:54px;padding:5px}.wrap{padding:8px}}
</style></head><body><div id="app"></div><script src="./app.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}</script></body></html>
